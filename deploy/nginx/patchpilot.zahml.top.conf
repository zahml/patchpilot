server {
    listen 80;
    server_name patchpilot.zahml.top;

    client_max_body_size 1M;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/patchpilot.zahml.top;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/patchpilot.zahml.top.log;
    error_log /www/wwwlogs/patchpilot.zahml.top.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name patchpilot.zahml.top;

    ssl_certificate /etc/letsencrypt/live/patchpilot.zahml.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patchpilot.zahml.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PatchPilotSSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1M;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /www/wwwlogs/patchpilot.zahml.top.ssl.log;
    error_log /www/wwwlogs/patchpilot.zahml.top.error.log;
}
