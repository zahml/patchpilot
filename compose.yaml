services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patchpilot}
      POSTGRES_USER: ${POSTGRES_USER:-patchpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchpilot-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-patchpilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-patchpilot-local}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-patchpilot}
      DATABASE_USERNAME: ${POSTGRES_USER:-patchpilot}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-patchpilot-local}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-patchpilot}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-patchpilot-local}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      PATCHPILOT_REVIEW_LISTENER_CONCURRENCY: ${PATCHPILOT_REVIEW_LISTENER_CONCURRENCY:-2}
      PATCHPILOT_REVIEW_LISTENER_PREFETCH: ${PATCHPILOT_REVIEW_LISTENER_PREFETCH:-1}
      PATCHPILOT_RATE_LIMIT_REQUESTS: ${PATCHPILOT_RATE_LIMIT_REQUESTS:-10}
      PATCHPILOT_RATE_LIMIT_WINDOW_MS: ${PATCHPILOT_RATE_LIMIT_WINDOW_MS:-60000}
      PATCHPILOT_MODEL_PROVIDER: ${PATCHPILOT_MODEL_PROVIDER:-offline}
      PATCHPILOT_MODEL_PROMPT_VERSION: ${PATCHPILOT_MODEL_PROMPT_VERSION:-v2}
      PATCHPILOT_OPENAI_BASE_URL: ${PATCHPILOT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      PATCHPILOT_OPENAI_API_KEY: ${PATCHPILOT_OPENAI_API_KEY:-}
      PATCHPILOT_OPENAI_MODEL: ${PATCHPILOT_OPENAI_MODEL:-gpt-4o-mini}
      PATCHPILOT_MODEL_TEMPERATURE: ${PATCHPILOT_MODEL_TEMPERATURE:-0.0}
      PATCHPILOT_MODEL_MAX_OUTPUT_TOKENS: ${PATCHPILOT_MODEL_MAX_OUTPUT_TOKENS:-4000}
      PATCHPILOT_MODEL_CONNECT_TIMEOUT_MS: ${PATCHPILOT_MODEL_CONNECT_TIMEOUT_MS:-3000}
      PATCHPILOT_MODEL_READ_TIMEOUT_MS: ${PATCHPILOT_MODEL_READ_TIMEOUT_MS:-30000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
