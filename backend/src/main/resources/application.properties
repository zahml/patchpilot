spring.application.name=patchpilot-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/patchpilot}
spring.datasource.username=${DATABASE_USERNAME:patchpilot}
spring.datasource.password=${DATABASE_PASSWORD:patchpilot-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

patchpilot.messaging.enabled=${PATCHPILOT_MESSAGING_ENABLED:true}
patchpilot.outbox.batch-size=${PATCHPILOT_OUTBOX_BATCH_SIZE:20}
patchpilot.outbox.confirm-timeout-ms=${PATCHPILOT_OUTBOX_CONFIRM_TIMEOUT_MS:3000}
patchpilot.outbox.poll-interval-ms=${PATCHPILOT_OUTBOX_POLL_INTERVAL_MS:1000}
patchpilot.review.listener.concurrency=${PATCHPILOT_REVIEW_LISTENER_CONCURRENCY:2}
patchpilot.review.listener.prefetch=${PATCHPILOT_REVIEW_LISTENER_PREFETCH:1}
patchpilot.review.retry.max-attempts=${PATCHPILOT_REVIEW_RETRY_MAX_ATTEMPTS:3}
patchpilot.review.retry.initial-backoff-ms=${PATCHPILOT_REVIEW_RETRY_INITIAL_BACKOFF_MS:250}
patchpilot.review.retry.max-backoff-ms=${PATCHPILOT_REVIEW_RETRY_MAX_BACKOFF_MS:2000}
patchpilot.rate-limit.enabled=${PATCHPILOT_RATE_LIMIT_ENABLED:true}
patchpilot.rate-limit.requests=${PATCHPILOT_RATE_LIMIT_REQUESTS:10}
patchpilot.rate-limit.window-ms=${PATCHPILOT_RATE_LIMIT_WINDOW_MS:60000}

patchpilot.model.provider=${PATCHPILOT_MODEL_PROVIDER:offline}
patchpilot.model.prompt-version=${PATCHPILOT_MODEL_PROMPT_VERSION:v2}
patchpilot.model.base-url=${PATCHPILOT_OPENAI_BASE_URL:https://api.openai.com/v1}
patchpilot.model.api-key=${PATCHPILOT_OPENAI_API_KEY:}
patchpilot.model.name=${PATCHPILOT_OPENAI_MODEL:gpt-4o-mini}
patchpilot.model.temperature=${PATCHPILOT_MODEL_TEMPERATURE:0.0}
patchpilot.model.max-output-tokens=${PATCHPILOT_MODEL_MAX_OUTPUT_TOKENS:4000}
patchpilot.model.connect-timeout-ms=${PATCHPILOT_MODEL_CONNECT_TIMEOUT_MS:3000}
patchpilot.model.read-timeout-ms=${PATCHPILOT_MODEL_READ_TIMEOUT_MS:30000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [requestId:%X{requestId}]
